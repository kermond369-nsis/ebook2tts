name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: Release note suffix
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # P5-A：根工程（:core/:engine）已升 AGP 9.0.1 ⇒ 需 Gradle ≥ 9.1.0
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.1.0"

      # 直接使用 runner 预装的 Android SDK（ubuntu-latest 自带 ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android：其内部执行 `sdkmanager tools`，
      # 而现 runner 的 cmdline-tools 20.0 已无 `tools` 包 ⇒ "Failed to find package 'tools'" 失败（2026-09-15 实测）。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "${SDK}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # compileSdk 36（甲方 2026-09-15 决定）；AGP 9 要求 build-tools ≥ 36.0.0
      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name:  Unit tests
        run: |
          gradle :core:test --no-daemon --stacktrace
          gradle :engine:testDebugUnitTest --no-daemon --stacktrace

      # :app 位于 app/android 这套独立 Gradle 构建；APK 必须由 Flutter 工具产出
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Build debug APK
        id: build
        working-directory: app
        run: |
          set -e
          flutter pub get
          flutter build apk --debug
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK_SRC=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$APK_SRC"
          APK="ebook2tts-local-${SHORT_SHA}-debug.apk"
          cp "$APK_SRC" "../$APK"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          ls -lh "../$APK"

      - name: Resolve release tag
        id: meta
        run: |
          SHORT_SHA="${{ steps.build.outputs.short_sha }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${SHORT_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          SHORT_SHA="${{ steps.build.outputs.short_sha }}"
          APK="${{ steps.build.outputs.apk }}"
          REPO="${{ github.repository }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TITLE="${GITHUB_REF_NAME}"
          else
            TITLE="build ${SHORT_SHA}"
          fi
          BODY="Automated debug APK for com.kermond.ebook2tts (0.2.0-alpha.1 rewrite).

          - Commit: ${GITHUB_SHA}
          - Abbreviated: ${SHORT_SHA}
          - Workflow: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "${{ inputs.reason }}" ]; then
            BODY="${BODY}
          - Note: ${{ inputs.reason }}"
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes "$BODY"
          else
            gh release create "$TAG" "$APK" --repo "$REPO" --title "$TITLE" --notes "$BODY" --latest
          fi
          gh release view "$TAG" --repo "$REPO" --json name,tagName,url,assets
