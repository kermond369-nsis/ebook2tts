name: Release

on:
  # 仅 tag 触发发布（正式版）。main 推送不再触发本工作流 —— 避免每次合并都生成 build-* 噪音 Release
  # （2026-09-19 甲方要求：发布页只保留 CI 产出的正式版；非 tag 的手动触发改为上传 workflow artifact）
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: Release note suffix
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # P5-A：根工程（:core/:engine）已升 AGP 9.0.1 ⇒ 需 Gradle ≥ 9.1.0
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.1.0"

      # 直接使用 runner 预装的 Android SDK（ubuntu-latest 自带 ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android：其内部执行 `sdkmanager tools`，
      # 而现 runner 的 cmdline-tools 20.0 已无 `tools` 包 ⇒ "Failed to find package 'tools'" 失败（2026-09-15 实测）。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "${SDK}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # compileSdk 36（甲方 2026-09-15 决定）；AGP 9 要求 build-tools ≥ 36.0.0
      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Unit tests
        run: |
          gradle :core:test --no-daemon --stacktrace
          gradle :engine:testDebugUnitTest --no-daemon --stacktrace

      # :app 位于 app/android 这套独立 Gradle 构建；APK 必须由 Flutter 工具产出
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      # 正式包签名：密钥与口令经 **Repository Secrets** 注入（不再需要本地手工构建）。
      # 缺 Secrets 时**不阻断**非 tag 构建；tag 构建若缺 Secrets 则显式失败（拒绝产出"伪正式包"）。
      - name: Prepare signing (tags only)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::tag 构建需要签名 Secrets（KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD）"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          cat > app/android/key.properties <<EOF
          storeFile=$KS
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          sed -i 's/^ *//' app/android/key.properties
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keystore=${KS}" >> "$GITHUB_OUTPUT"

      # tag ⇒ 正式签名包（arm64 单 ABI，含 ABI 收敛后处理）；非 tag ⇒ 既有 debug 包
      - name: Build APK
        id: build
        working-directory: app
        run: |
          set -e
          flutter pub get
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            bash ../scripts/build-release-arm64.sh build/app/outputs/flutter-apk/app-release-arm64.apk
            APK_SRC=build/app/outputs/flutter-apk/app-release-arm64.apk
            APK="ebook2tts-${SHORT_SHA}-arm64-release.apk"
          else
            flutter build apk --debug
            APK_SRC=build/app/outputs/flutter-apk/app-debug.apk
            APK="ebook2tts-${SHORT_SHA}-debug.apk"
          fi
          test -f "$APK_SRC"
          cp "$APK_SRC" "../$APK"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          ls -lh "../$APK"

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${{ steps.build.outputs.short_sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # 非 tag（手动触发）：产物作为 workflow artifact 留存，不创建 Release
      - name: Upload APK artifact (non-tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.build.outputs.short_sha }}
          path: ${{ steps.build.outputs.apk }}
          retention-days: 14

      # 仅 tag 发布：保证发布页只出现正式版
      - name: Publish release (gh CLI)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          APK="${{ steps.build.outputs.apk }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # 已存在的 Release：**只补/替换资产，绝不覆盖人工撰写的说明与标题**
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          else
            BODY="Automated build for com.kermond.ebook2tts.

          - Commit: ${GITHUB_SHA}
          - Workflow: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "${{ inputs.reason }}" ]; then BODY="${BODY}
          - Note: ${{ inputs.reason }}"; fi
            gh release create "$TAG" "$APK" --repo "$REPO" --title "$TAG" --notes "$BODY" --latest
          fi
          gh release view "$TAG" --repo "$REPO" --json name,tagName,url,assets
