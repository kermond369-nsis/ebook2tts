name: Release

on:
  # 仅 tag 触发发布（正式版）。main 推送不再触发本工作流 —— 避免每次合并都生成 build-* 噪音 Release
  # （2026-09-19 甲方要求：发布页只保留 CI 产出的正式版；非 tag 的手动触发改为上传 workflow artifact）
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: Release note suffix
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # P5-A：根工程（:core/:engine）已升 AGP 9.0.1 ⇒ 需 Gradle ≥ 9.1.0
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.1.0"

      # 直接使用 runner 预装的 Android SDK（ubuntu-latest 自带 ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android：其内部执行 `sdkmanager tools`，
      # 而现 runner 的 cmdline-tools 20.0 已无 `tools` 包 ⇒ "Failed to find package 'tools'" 失败（2026-09-15 实测）。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "${SDK}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # compileSdk 36（甲方 2026-09-15 决定）；AGP 9 要求 build-tools ≥ 36.0.0
      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Unit tests
        run: |
          gradle :core:test --no-daemon --stacktrace
          gradle :engine:testDebugUnitTest --no-daemon --stacktrace

      # :app 位于 app/android 这套独立 Gradle 构建；APK 必须由 Flutter 工具产出
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      # 正式包签名：密钥与口令经 **Repository Secrets** 注入（不再需要本地手工构建）。
      # tag 构建若缺 Secrets 则显式失败；非 tag 手动触发若注入了 Secrets 也打签名包，否则打 profile 预览包（永不发布 debug 包）。
      - name: Flutter widget tests
        working-directory: app
        run: |
          flutter pub get
          flutter test

      - name: Prepare signing (when secrets provided; required on tags)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::tag 构建需要签名 Secrets（KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD）"
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          cat > app/android/key.properties <<EOF
          storeFile=$KS
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          sed -i 's/^ *//' app/android/key.properties
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keystore=${KS}" >> "$GITHUB_OUTPUT"

      # 正式发布仅产出 Arm64 + Universal 两份精简包（调试包仅在 ci.yml 产出，绝不进 Release）
      - name: Build APKs (Arm64 + Universal)
        id: build
        run: |
          set -e
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PREFIX="${GITHUB_REF_NAME}"
          else
            PREFIX="${SHORT_SHA}"
          fi
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            bash scripts/build-release.sh arm64 "build/app/outputs/flutter-apk/app-release-arm64.apk"
            bash scripts/build-release.sh universal "build/app/outputs/flutter-apk/app-release-universal.apk"
            ARM64_SRC="app/build/app/outputs/flutter-apk/app-release-arm64.apk"
            UNI_SRC="app/build/app/outputs/flutter-apk/app-release-universal.apk"
            ARM64_OUT="ebook2tts-${PREFIX}-arm64-release.apk"
            UNI_OUT="ebook2tts-${PREFIX}-universal-release.apk"
          else
            (
              cd app
              EBOOK2TTS_ABI_MODE=arm64 flutter build apk --profile --target-platform android-arm64
              cp build/app/outputs/flutter-apk/app-profile.apk "../ebook2tts-${PREFIX}-arm64-profile.apk"
              EBOOK2TTS_ABI_MODE=universal flutter build apk --profile --target-platform android-arm64,android-arm,android-x64
              cp build/app/outputs/flutter-apk/app-profile.apk "../ebook2tts-${PREFIX}-universal-profile.apk"
            )
            ARM64_OUT="ebook2tts-${PREFIX}-arm64-profile.apk"
            UNI_OUT="ebook2tts-${PREFIX}-universal-profile.apk"
            ARM64_SRC=""
            UNI_SRC=""
          fi
          if [ -n "$ARM64_SRC" ]; then
            test -f "$ARM64_SRC" && cp "$ARM64_SRC" "$ARM64_OUT"
            test -f "$UNI_SRC" && cp "$UNI_SRC" "$UNI_OUT"
          fi
          test -f "$ARM64_OUT"
          test -f "$UNI_OUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk_arm64=${ARM64_OUT}" >> "$GITHUB_OUTPUT"
          echo "apk_universal=${UNI_OUT}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARM64_OUT" "$UNI_OUT"
          wc -c "$ARM64_OUT" "$UNI_OUT"

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${{ steps.build.outputs.short_sha }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # 非 tag（手动触发）：产物作为 workflow artifact 留存，不创建 Release
      - name: Upload APK artifacts (non-tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: ebook2tts-${{ steps.build.outputs.short_sha }}-release-pair
          path: |
            ${{ steps.build.outputs.apk_arm64 }}
            ${{ steps.build.outputs.apk_universal }}
          if-no-files-found: error
          retention-days: 14

      # 仅 tag 发布：每次只发布 Arm64 与 Universal 两个精简包
      - name: Publish release (gh CLI)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          APK_ARM64="${{ steps.build.outputs.apk_arm64 }}"
          APK_UNI="${{ steps.build.outputs.apk_universal }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_ARM64" "$APK_UNI" --repo "$REPO" --clobber
          else
            BODY="Automated release for com.kermond.ebook2tts (${TAG}).

          - \`${APK_ARM64}\`: 主流手机推荐（仅 arm64-v8a，体积最精简）
          - \`${APK_UNI}\`: 全架构兼容（arm64-v8a / armeabi-v7a / x86_64）
          - Commit: ${GITHUB_SHA}
          - Workflow: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$REASON" ]; then BODY="${BODY}
          - Note: ${REASON}"; fi
            gh release create "$TAG" "$APK_ARM64" "$APK_UNI" --repo "$REPO" --title "$TAG" --notes "$BODY" --latest
          fi
          gh release view "$TAG" --repo "$REPO" --json name,tagName,url,assets
