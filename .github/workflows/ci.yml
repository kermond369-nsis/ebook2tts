name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # P5-A：根工程（:core/:engine）已升 AGP 9.0.1 ⇒ 需 Gradle ≥ 9.1.0
      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.1.0"

      # 直接使用 runner 预装的 Android SDK（ubuntu-latest 自带 ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不用 android-actions/setup-android：其内部执行 `sdkmanager tools`，
      # 而现 runner 的 cmdline-tools 20.0 已无 `tools` 包 ⇒ "Failed to find package 'tools'" 失败（2026-09-15 实测）。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"
          echo "${SDK}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # compileSdk 36（甲方 2026-09-15 决定）；AGP 9 要求 build-tools ≥ 36.0.0
      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name:  Core unit tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Engine unit tests
        run: gradle :engine:testDebugUnitTest --no-daemon --stacktrace

      # :app 只存在于 app/android 这套独立 Gradle 构建里（根工程不含 :app），
      # 且 Flutter 入口必须由 Flutter 工具驱动（settings.gradle.kts 依赖其生成的 local.properties）。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Build debug APK
        id: build
        working-directory: app
        run: |
          set -e
          flutter pub get
          flutter build apk --debug
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$APK"
          OUT="ebook2tts-${SHORT_SHA}-debug.apk"
          cp "$APK" "../$OUT"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "ARTIFACT=${OUT}" >> "$GITHUB_ENV"
          ls -lh "../$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ebook2tts-${{ env.SHORT_SHA }}-debug
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 7
