name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.5"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Core unit tests
        run: gradle :core:test --no-daemon --stacktrace

      - name: Engine unit tests
        run: gradle :engine:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        id: build
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          OUT="ebook2tts-local-${SHORT_SHA}-debug.apk"
          cp "$APK" "$OUT"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "ARTIFACT=${OUT}" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ebook2tts-local-${{ env.SHORT_SHA }}-debug
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
