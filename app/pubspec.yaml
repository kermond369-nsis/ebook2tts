name: ebook2tts
description: "书声本地——离线电子书朗读 App（P3 Flutter 界面，界面与 :engine 同属一个 App）"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # 状态管理（ADR-005：Riverpod）
  flutter_riverpod: ^3.4.3
  # 说明（IM-511，甲方 2026-09-15）：已移除 `shared_preferences` ——
  # 真机配置的唯一写者是引擎侧 MMKV（ADR-012）；该依赖只剩 Mock 阶段用途（现为内存态），
  # 且其 Android 端要求 compileSdk 36（甲方判定"过度激进"），故不再保留。

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
